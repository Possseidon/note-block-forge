[workspace]
members = ["note-block-forge", "note-block-forge-cli", "note-block-forge-lib"]
default-members = ["note-block-forge"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.5.34", features = ["derive"] }
derive_more = { version = "2.0.1", features = ["from"] }
eframe = { version = "0.31.1", features = ["persistence"] }
egui = { version = "0.31.1" }
egui_extras = { version = "0.31.1", features = ["image"] }
enum-map = "2.7.3"
midir = "0.10.1"
rfd = "0.15.3"
rodio = { version = "0.20.1", default-features = false, features = ["vorbis"] }
serde = { version = "1.0.219", features = ["derive"] }
single_value_channel = "1.2.2"

[profile.dev.package."*"]
opt-level = 3
